version: "3.9"

services:
  api:
    image: python:3.11-slim
    container_name: ecom_api
    working_dir: /app
    volumes:
      - ./apps/api:/app
    command: bash -c "pip install fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  web:
    image: node:20-alpine
    container_name: ecom_web
    working_dir: /app
    volumes:
      - ./apps/web:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
